name: Firmware or tooling defect
description: Report a reproducible software, simulation or generator problem.
title: "[Bug] "
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include the exact command and output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: revision
    attributes:
      label: Revision and environment
      description: Commit, board revision, KiCad, Python, ESP-IDF and ngspice versions as applicable.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
