name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linked-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check Python sources
        run: >-
          python -m compileall -q
          tools simulation firmware tests
      - name: Check interactive BOM synchronization
        run: python tools/interactive_bom.py --check
      - name: Check README PCB render synchronization
        run: python tools/readme_pcb_render.py --check
      - name: Check hardware and software version streams
        run: python tools/versioning.py
      - name: Verify ordered hardware release package
        run: python tools/verify_hardware_release.py
      - name: Check canonical paths and documentation
        run: python tools/audit_project.py
